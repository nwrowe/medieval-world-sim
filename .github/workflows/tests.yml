name: Test simulation
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install development linter
        run: python -m pip install ruff==0.9.10
      - name: Check Python source and test lint
        run: |
          ruff check src tests
          ruff check --select E4,E7,E9,F src/medieval_world_sim/core/commands.py tests/test_command_registry.py
          ruff check --select E4,E7,E9,F src/medieval_world_sim/web/accounts.py src/medieval_world_sim/web/social.py src/medieval_world_sim/web/journal.py src/medieval_world_sim/web/ledger.py src/medieval_world_sim/web/checkpoint.py
      - name: Verify browser JavaScript syntax
        run: node --check src/medieval_world_sim/web/static/app.js
      - name: Verify extracted browser view module
        run: |
          node --check src/medieval_world_sim/web/static/world-views.mjs
          node tests/test_browser_views.mjs
          node --check src/medieval_world_sim/web/static/community-views.mjs
          node --check src/medieval_world_sim/web/static/city-views.mjs
          node --check src/medieval_world_sim/web/static/character-views.mjs
          node tests/test_feature_views.mjs
      - name: Run standard-library unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Measure concurrent multiplayer performance (observational)
        env:
          PYTHONPATH: src
        run: python -m benchmarks.phase4_multiplayer --accounts 40 --requests 80 --workers 12 --views 32
      - name: Smoke test CLI
        env:
          PYTHONPATH: src
        run: python -m medieval_world_sim --legacy --citizens 200 --days 30 --seed 42 --json > /tmp/sim-results.json
      - name: Smoke test five-city supply chain
        env:
          PYTHONPATH: src
        run: python -m medieval_world_sim.regional_demo > /tmp/regional-demo.txt
      - name: Smoke test equipped combat, XP and finite loot
        env:
          PYTHONPATH: src
        run: python -m medieval_world_sim.combat_demo > /tmp/combat-demo.txt
      - name: Smoke test deterministic NPC economy
        env:
          PYTHONPATH: src
        run: |
          python -m medieval_world_sim.agents.demo --npcs 28 --days 6 --seed 42 --json > /tmp/npc-economy.json
          cat /tmp/npc-economy.json
      - name: Extended 30-day 50-NPC economy experiment
        env:
          PYTHONPATH: src
        run: |
          python -m medieval_world_sim.agents.demo --npcs 50 --days 30 --seed 42 --json > /tmp/npc-economy-30d.json
          cat /tmp/npc-economy-30d.json
      - name: Smoke test regional merchant arbitrage
        env:
          PYTHONPATH: src
        run: python -m medieval_world_sim --scenario trade
      - name: Smoke test six-school magic progression catalog
        env:
          PYTHONPATH: src
        run: python -m medieval_world_sim --scenario magic
      - name: Smoke test housing and mounted road travel
        env:
          PYTHONPATH: src
        run: python -m medieval_world_sim --scenario housing
      - name: Smoke test web server command
        env:
          PYTHONPATH: src
        run: python -m medieval_world_sim.web --help
