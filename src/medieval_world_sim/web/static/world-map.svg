<rect x="23" y="23" width="954" height="574" rx="3" fill="none" stroke="#a99066" stroke-width="1" opacity=".65"/>
<g transform="translate(888 98)" stroke="#65513c" fill="none" stroke-width="2">
<circle r="39" stroke-dasharray="2 4"/><path d="M0-48L9-8 0 48-9 8Z" fill="#7b6040"/><path d="M-48 0L-9-8 48 0 9 8Z" fill="#e6d7ae"/><circle r="5" fill="#725c3d"/><text x="-5" y="-57" font-family="Georgia" fill="#65513c" stroke="none" font-size="17">N</text>
</g>
<g fill="#715a3a" font-family="Georgia,serif" text-anchor="middle">
<text x="506" y="54" font-size="25" letter-spacing="4">THE FIVE CITIES</text>
