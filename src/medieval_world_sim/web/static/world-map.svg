<path d="M1000 392q-50-28-82-16t-41 47q-4 33-38 48t-16 47q16 15 49 32t49 70h79Z" fill="#adc1b2" stroke="#687b70" stroke-width="2" opacity=".8"/>
<path d="M1000 392q-50-28-82-16t-41 47q-4 33-38 48t-16 47q16 15 49 32t49 70h79Z" fill="url(#sea)"/>
<path d="M831 30q-18 56-48 88t-36 84q-3 39-28 66t-18 53q9 27-4 48t-25 47" fill="none" stroke="#7c9fa0" stroke-width="11" opacity=".65" stroke-linecap="round"/>
<path d="M831 30q-18 56-48 88t-36 84q-3 39-28 66t-18 53q9 27-4 48t-25 47" fill="none" stroke="#e9dfba" stroke-width="2.2" opacity=".7"/>
