<use href="#mount" transform="translate(328 65) scale(1.0)"/><use href="#mount" transform="translate(365 54) scale(1.12)"/><use href="#mount" transform="translate(412 83) scale(.84)"/><use href="#mount" transform="translate(454 61) scale(.94)"/><use href="#mount" transform="translate(515 73) scale(.68)"/>
