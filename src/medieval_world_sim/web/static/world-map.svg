<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">The Five Cities — parchment map</title><desc id="desc">Hand-inked high fantasy coastline, forests, mountains, rivers, royal roads, and a compass rose. Interactive city destinations appear above this illustration.</desc>
<defs>
  <radialGradient id="parchment"><stop stop-color="#f0dfb4"/><stop offset=".76" stop-color="#e1ca98"/><stop offset="1" stop-color="#ae8d5e"/></radialGradient>
  <pattern id="sea" width="31" height="22" patternUnits="userSpaceOnUse"><path d="M2 15q8-7 16 0t15 0" fill="none" stroke="#718d8b" stroke-width="1.25" opacity=".31"/></pattern>
  <pattern id="grain" width="60" height="48" patternUnits="userSpaceOnUse"><path d="M3 4l3-2M25 39l2-4M48 24l-4 2" stroke="#7e603d" stroke-width=".7" opacity=".27"/></pattern>
  <g id="pine" fill="none" stroke="#465b45" stroke-width="1.7" stroke-linejoin="round"><path d="M0 0L-10 17H-6L-14 30H-5L-16 43H15L5 30H13L5 17Z"/><path d="M0 35v16" stroke-width="2"/></g>
  <g id="mount" fill="#d4c19b" stroke="#695c45" stroke-width="2"><path d="M0 58L38 0 84 58Z"/><path d="M37 0l-12 19 14-4 9 14-3-18Z" fill="#faf1db" stroke="none"/><path d="M19 43l19-30 15 23" fill="none" opacity=".7"/></g>
  <filter id="ink"><feGaussianBlur stdDeviation=".4"/></filter>
</defs>
<rect width="1000" height="620" fill="url(#parchment)"/>
<rect width="1000" height="620" fill="url(#grain)"/>
<!-- western waters, torn coastline with sketched surf -->
<path d="M0 0H280q-18 31-26 65t-34 42q-17 20-4 48t-12 47q-27 15-41 45t-12 62q10 25-13 44t-14 41q13 26-12 51t-20 50q4 33-22 48L63 620H0Z" fill="#a2bab1" opacity=".73"/>
<path d="M0 0H280q-18 31-26 65t-34 42q-17 20-4 48t-12 47q-27 15-41 45t-12 62q10 25-13 44t-14 41q13 26-12 51t-20 50q4 33-22 48L63 620H0Z" fill="url(#sea)"/>
<path d="M280 0q-18 31-26 65t-34 42q-17 20-4 48t-12 47q-27 15-41 45t-12 62q10 25-13 44t-14 41q13 26-12 51t-20 50q4 33-22 48L63 620" stroke="#675c49" fill="none" stroke-width="3"/>
<path d="M267 0q-28 40-28 64t-40 49q-22 25-2 42t-17 47q-32 27-36 56t-8 60q-5 22-24 36t-8 39q4 20-10 41t-20 54q4 32-27 69" stroke="#796d55" fill="none" stroke-width="1" opacity=".6"/>
