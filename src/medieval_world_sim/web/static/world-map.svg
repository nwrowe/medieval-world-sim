<use href="#pine" transform="translate(769 440) scale(.69)"/><use href="#pine" transform="translate(804 458) scale(.6)"/><use href="#pine" transform="translate(751 478) scale(.68)"/>
</g>
<!-- royal roads, dotted -->
<g fill="none" stroke="#765f48" stroke-linecap="round" stroke-width="2.4" stroke-dasharray="3 9" opacity=".75">
<path d="M498 295Q414 231 333 171"/>
<path d="M498 295Q614 242 711 206"/>
<path d="M498 295Q581 353 650 430"/>
<path d="M498 295Q388 403 306 487"/>
</g>
<g fill="none" stroke="#d4b77c" stroke-width="8" opacity=".15">
<path d="M498 295Q414 231 333 171"/><path d="M498 295Q614 242 711 206"/><path d="M498 295Q581 353 650 430"/><path d="M498 295Q388 403 306 487"/>
</g>
<!-- Ink flourishes and callouts -->
<g font-family="Georgia,serif" fill="#72634c" opacity=".78">
<text x="61" y="207" font-size="19" font-style="italic" letter-spacing="3" transform="rotate(-84 61 207)">THE WESTERN SEA</text>
<text x="345" y="49" font-size="16" font-style="italic" letter-spacing="2">IRONSPINE PEAKS</text>
<text x="610" y="185" font-size="15" font-style="italic">Elderwood</text>
<text x="845" y="566" font-size="18" font-style="italic" transform="rotate(-19 845 566)">Glassmere</text>
<text x="385" y="550" font-size="14" font-style="italic">Southfield Plains</text>
