</g>
<path d="M396 83H608M426 89H578" stroke="#896d48" stroke-width="1" opacity=".6"/>
<path d="M821 580h129m-129-3v7m43-7v7m43-7v7m43-7v7" stroke="#6c5b45" stroke-width="2"/>
<text x="885" y="573" text-anchor="middle" font-size="10" fill="#6c5b45" font-family="Georgia">ROYAL LEAGUES</text>
