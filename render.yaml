# Paid, single-instance test deployment: persistent save + HTTPS at the edge.
# Do not put an access code in GitHub: Render asks for GAME_ACCESS_TOKEN.
services:
  - type: web
    name: medieval-world-playtest
    runtime: python
    plan: 0.5c-512mb
    region: ohio
    buildCommand: pip install -e .
    startCommand: python -m medieval_world_sim.web.deploy
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: GAME_ACCESS_TOKEN
        sync: false
      - key: GAME_SAVE_DIR
        value: /var/data
      - key: PYTHON_VERSION
        value: 3.11.11
    disk:
      name: medieval-world-save
      mountPath: /var/data
      sizeGB: 1
