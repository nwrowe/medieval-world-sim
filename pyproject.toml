[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "medieval-world-sim"
version = "0.1.0"
description = "Exploratory deterministic sandbox for a persistent medieval RPG economy"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Phase 2 gate: syntax/undefined-name and structural correctness first.
# Expand style and unused-import checks as legacy modules are migrated.
select = ["E9", "F63", "F7", "F82"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"medieval_world_sim.web" = ["static/*.html", "static/*.css", "static/*.js", "static/*.svg"]
