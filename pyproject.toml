[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "medieval-world-sim"
version = "0.1.0"
description = "Exploratory deterministic sandbox for a persistent medieval RPG economy"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"medieval_world_sim.web" = ["static/*.html", "static/*.css", "static/*.js", "static/*.mjs", "static/*.svg"]
